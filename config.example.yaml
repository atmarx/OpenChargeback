# OpenChargeback Configuration
# Copy this file to instance/config.yaml and customize for your environment

# Development mode - when true, emails are saved to files instead of sent via SMTP
dev_mode: false

# Currency symbol for display (e.g., "$", "€", "£", "¥")
currency: "$"

database:
  path: ./instance/billing.db

smtp:
  host: smtp.example.edu
  port: 587
  use_tls: true
  username: ${SMTP_USER}      # Set via environment variable
  password: ${SMTP_PASSWORD}  # Set via environment variable

email:
  from_address: hpc-billing@example.edu
  from_name: Research Computing Billing
  subject_template: "Research Computing Charges - {billing_period}"

# Map FOCUS tag names to internal fields
# These are the tag keys in your cloud provider's FOCUS export
tag_mapping:
  pi_email: "pi_email"
  project_id: "project_id"
  fund_org: "fund_org"
  cost_center: "cost_center"
  # Custom reference fields - map to your institution's tags
  # These appear in journal exports and are searchable in the UI
  reference_1: "grant_number"    # e.g., NSF award ID, PO number
  reference_2: "request_id"      # e.g., ServiceNow ticket, allocation ID

output:
  pdf_dir: ./instance/output/pdfs
  journal_dir: ./instance/output/journals
  email_dir: ./instance/output/emails   # For dev_mode email files
  archive_dir: ./instance/output/archive  # Retained original source files; feeds the monthly close package
  # Retention is indefinite by default. A future RETENTION_YEARS hook (-1 = indefinite)
  # is the planned place to wire policy-based rolloff. Until then, the archive grows.

logging:
  level: INFO                     # DEBUG, INFO, WARN, WARNING, ERROR
  format: splunk                  # "splunk" (key=value) or "json"
  file: ./instance/logs/openchargeback.log  # Optional file output (also logs to stderr)

  # Remote syslog.  OpenChargeback emits every action it takes and does not
  # decide which ones are worth keeping -- that call belongs to whoever runs
  # the collector.  Adds to stderr and file output rather than replacing them.
  #
  # UDP cannot tell whether anything is listening.  Use TCP if you need
  # startup to complain when the collector is unreachable.
  # syslog:
  #   host: syslog.example.edu
  #   port: 514
  #   protocol: udp               # "udp" (fire-and-forget) or "tcp"
  #   facility: local4            # user, daemon, or local0-local7
  #   ident: openchargeback       # tag prefixed to every line

# Web interface configuration
web:
  enabled: true
  host: 127.0.0.1
  port: 8000
  secret_key: ${WEB_SECRET_KEY}  # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
  session_lifetime_hours: 8

  # Bootstrap/recovery users defined in config
  # These users are available during initial setup or for emergency recovery.
  #
  # SECURITY: no working password ships here on purpose.  Generate your own hash
  # before first run — the app refuses to boot in production (dev_mode: false)
  # while the old shipped example hash is present.  For a quick local look,
  # set dev_mode: true above instead.
  users:
    admin:
      email: admin@example.edu
      display_name: "Admin User"
      # Generate hash with: python -c "import bcrypt; print(bcrypt.hashpw(b'yourpassword', bcrypt.gensalt()).decode())"
      password_hash: "REPLACE-ME-with-a-bcrypt-hash-from-the-command-above"
      role: admin  # admin, reviewer, or viewer
      # Recovery mode - when true, this user ALWAYS authenticates against config.yaml,
      # bypassing the database (cannot be revoked from the UI). Leave false for a
      # normal bootstrap admin that DB users can override; set true only for a
      # deliberate break-glass account.
      recovery: false

  # Password policy for database users
  # Enforced when creating users or changing passwords. If requirements are
  # tightened after users exist, they will be prompted to update on next login.
  password_requirements:
    min_length: 8
    require_uppercase: false
    require_lowercase: false
    require_numbers: false
    require_special_chars: false

# Review/flagging configuration
# Charges matching these patterns are auto-flagged for manual review
review:
  # Regex patterns that trigger review if matched in charge fields
  flag_patterns: []
  # Regex patterns that fund/org codes MUST match (flagged if no match)
  # Example: require format like "DEPT-PROJECT-2024"
  fund_org_patterns: []

# Import source configuration
# Pre-defined sources for CSV imports with auto-detection and defaults
imports:
  known_sources:
  - name: AWS
    pattern: aws           # Filename pattern for auto-selection
    fund_org: ""           # Credit fund/org (source receives funds)
    account_code: ""       # Default GL account code
  - name: Azure
    pattern: azure
    fund_org: ""
    account_code: ""
  - name: Azure Local
    pattern: azure-local   # On-prem Azure Stack HCI / Azure Local VMs
    fund_org: ""
    account_code: ""
  - name: GCP
    pattern: gcp
    fund_org: ""
    account_code: ""
  - name: HPC
    pattern: hpc
    fund_org: ""
    account_code: ""
  - name: openai-tokens    # Must equal the ingest source name for journal credits
    pattern: openai        # ChatGPT EDU / OpenAI API usage
    fund_org: "110900-10000"   # Central IT — the fund that bought the credit pool
    account_code: "54500"
  - name: Storage
    pattern: storage
    fund_org: ""
    account_code: ""

  # Import bounds.  A 15 MB vendor export is roughly 72k FOCUS rows, which
  # imports in about 15 seconds — but nothing stops a file ten times that,
  # and an unbounded import doesn't fail cleanly: it runs until the gateway
  # in front of the app gives up, and the browser shows an opaque error.
  # These make the ceiling a stated policy with a number in the message.
  max_upload_mb: 64          # Whole POST body, so this covers multi-file uploads
  max_rows_per_file: 1000000 # Checked after parse, before any row is written
  max_errors_reported: 100   # Per-row errors kept; the rest are counted, not stored

# Journal/GL export configuration
journal:
  # Regex with named capture groups to parse fund_org into components.
  # Match YOUR institution's code shape; a fund_org that doesn't match lands
  # whole in the Fund column with Orgn blank (visible, never dropped).
  # Banner-style fund-orgn codes (the 2026-01 OpenAI sample): "130050-10000"
  #   -> fund="130050", orgn="10000"
  # For orgn-first codes like "DEPT-PROJECT-2024" use:
  #   '^(?P<orgn>[^-]+)-(?P<fund>.+)$'
  fund_org_regex: '^(?P<fund>[0-9]{6})-(?P<orgn>[0-9]{5})$'

  # Regex to validate account codes (optional, leave empty to skip)
  account_code_regex: ""

  # Template file. A default journal_gl.csv ships with the package; a file of
  # this name in your templates/ directory overrides it.
  template: journal_gl.csv

  # Default account code if not specified on charge or source
  default_account: ""

  # Where a source with no configured fund_org is credited, so the journal still
  # balances instead of dropping the credit. Leave empty to use a visible
  # "CLEARING-<source>" placeholder that both balances the entry and flags that
  # the source needs a real fund_org.
  clearing_fund_org: ""

  # Description templates for journal entries
  # Available variables: {source}, {period}, {fund_org}, {pi_email}, {project_id}
  debit_description: "{source} {period} Research Computing Charges"
  credit_description: "{source} {period} Research Computing Charges"

