# OpenChargeback CI/CD Pipeline
# Runs tests on every push, deploys to openchargeback.dev.xram.net on main
#
# Pip cache mounted at /opt/cache/pip for faster builds

when:
  - event: push

labels:
  host: xdocker01

steps:
  - name: test-and-lint
    image: python:3.12-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - pip install --cache-dir /cache/pip -e ".[dev]"
      - ruff check src/
      - pytest -v --tb=short
    volumes:
      - /opt/cache/pip:/cache/pip

  # Provenance gate. The forensic close package research accounting relies on
  # must be byte-deterministic: same canonical month of data -> same bytes ->
  # same sha256, in BOTH wrappers (zip and pdf portfolio). This step proves it on
  # the real shipped sample data — two months, two wrappers — and checks that the
  # zip's entries and the pdf's embedded attachments are byte-identical (the
  # wrapper never changes a number) and that MANIFEST.txt honestly hashes every
  # member. If it ever goes red, the "signed package" promise is broken — do not ship.
  - name: close-package-determinism
    image: python:3.12-slim
    commands:
      - pip install --cache-dir /cache/pip -e ".[dev]"
      - pytest tests/test_close_package.py -v --tb=short
    volumes:
      - /opt/cache/pip:/cache/pip

  - name: typecheck
    image: python:3.12-slim
    commands:
      - pip install --cache-dir /cache/pip -e ".[dev]" types-PyYAML
      - mypy src/ --ignore-missing-imports
    volumes:
      - /opt/cache/pip:/cache/pip

  # Build the wheel the Docker image installs.  CI's editable `pip install -e`
  # never exercises the wheel path, so a packaging break (e.g. a duplicate
  # force-include) sailed through green tests and only blew up at deploy.  This
  # step reproduces the image's build so packaging errors fail CI first.
  - name: build-wheel
    image: python:3.12-slim
    commands:
      - pip install --cache-dir /cache/pip build
      - python -m build --wheel
    volumes:
      - /opt/cache/pip:/cache/pip

  - name: sbom
    image: python:3.12-slim
    commands:
      - pip install --cache-dir /cache/pip cyclonedx-bom
      - pip install --cache-dir /cache/pip -e .
      - cyclonedx-py environment --of json -o src/openchargeback/web/static/sbom.json
    volumes:
      - /opt/cache/pip:/cache/pip
    when:
      branch: main
    depends_on:
      - test-and-lint

  - name: deploy
    image: docker:cli
    commands:
      # Mount /opt/projects identically on both sides so compose's relative
      # bind-mounts (./instance) resolve to a host-valid absolute path.  A
      # mismatched CI-client path (e.g. /projects/...) would be passed verbatim
      # to dockerd and bind-mount a stale host directory.
      - cd /opt/projects/${CI_REPO_NAME} || git clone ${CI_REPO_CLONE_URL} /opt/projects/${CI_REPO_NAME}
      # Deterministic checkout: `git checkout <branch> && git pull` leaves a dirty
      # or diverged /opt/projects tree pinned to a stale commit, so the docker
      # build ran OLD code (it kept hitting a packaging error already fixed on
      # main). Hard-reset to the exact commit that triggered this build, so what
      # deploys is always what CI just tested. NOTE: no `git clean` here — the
      # untracked ./instance dir holds the live DB/archives and must survive;
      # reset --hard only touches tracked files.
      - cd /opt/projects/${CI_REPO_NAME} && git fetch origin && git reset --hard ${CI_COMMIT_SHA}
      - docker network inspect gateway-stack_gateway >/dev/null 2>&1 || docker network create gateway-stack_gateway
      - cd /opt/projects/${CI_REPO_NAME} && docker compose up -d --build
      - docker image prune -f || true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/projects:/opt/projects
    when:
      branch: main
    depends_on:
      - sbom
      - close-package-determinism
      - typecheck
      - build-wheel
