# OpenChargeback CI/CD Pipeline
# Runs tests on every push, deploys to openchargeback.dev.xram.net on main
#
# Pip cache mounted at /opt/cache/pip for faster builds

when:
  - event: push

labels:
  host: xdocker01

steps:
  - name: test-and-lint
    image: python:3.12-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - pip install --cache-dir /cache/pip -e ".[dev]"
      - ruff check src/ tools/
      - pytest -v --tb=short
    volumes:
      - /opt/cache/pip:/cache/pip

  # Provenance gate. The forensic close package research accounting relies on
  # must be byte-deterministic: same canonical month of data -> same bytes ->
  # same sha256, in BOTH wrappers (zip and pdf portfolio). This step proves it on
  # the real shipped sample data — two months, two wrappers — and checks that the
  # zip's entries and the pdf's embedded attachments are byte-identical (the
  # wrapper never changes a number) and that MANIFEST.txt honestly hashes every
  # member. If it ever goes red, the "signed package" promise is broken — do not ship.
  - name: close-package-determinism
    image: python:3.12-slim
    commands:
      - pip install --cache-dir /cache/pip -e ".[dev]"
      - pytest tests/test_close_package.py -v --tb=short
    volumes:
      - /opt/cache/pip:/cache/pip

  - name: typecheck
    image: python:3.12-slim
    commands:
      - pip install --cache-dir /cache/pip -e ".[dev]" types-PyYAML
      - mypy src/ tools/ --ignore-missing-imports
    volumes:
      - /opt/cache/pip:/cache/pip

  # Build the wheel the Docker image installs.  CI's editable `pip install -e`
  # never exercises the wheel path, so a packaging break (e.g. a duplicate
  # force-include) sailed through green tests and only blew up at deploy.  This
  # step reproduces the image's build so packaging errors fail CI first.
  - name: build-wheel
    image: python:3.12-slim
    commands:
      - pip install --cache-dir /cache/pip build
      - python -m build --wheel
    volumes:
      - /opt/cache/pip:/cache/pip

  - name: sbom
    image: python:3.12-slim
    commands:
      - pip install --cache-dir /cache/pip cyclonedx-bom
      - pip install --cache-dir /cache/pip -e .
      - cyclonedx-py environment --of json -o src/openchargeback/web/static/sbom.json
    volumes:
      - /opt/cache/pip:/cache/pip
    when:
      branch: main
    depends_on:
      - test-and-lint

  - name: deploy
    image: docker:cli
    commands:
      # Mount /opt/projects identically on both sides so compose's relative
      # bind-mounts (./instance) resolve to a host-valid absolute path.  A
      # mismatched CI-client path (e.g. /projects/...) would be passed verbatim
      # to dockerd and bind-mount a stale host directory.
      - cd /opt/projects/${CI_REPO_NAME} || git clone ${CI_REPO_CLONE_URL} /opt/projects/${CI_REPO_NAME}
      # Deterministic checkout: `git checkout <branch> && git pull` was leaving
      # the /opt/projects tree pinned to a stale commit, so the docker build ran
      # OLD code (it kept hitting a packaging error already fixed on main). The
      # build log's "failed to read current commit information ... is-inside-
      # work-tree" showed the real cause: this dir has no valid .git (the
      # `cd || clone` guard above never clones because the dir already exists
      # with the untracked ./instance data), so every git fetch/reset silently
      # failed and the docker build kept using the stale tree.
      #
      # ROOT CAUSE (from the #42 deploy log): "fatal: detected dubious ownership
      # in repository at '/opt/projects/openchargeback'". The checkout dir is
      # owned by a different UID than this deploy container's user, so git 2.35+
      # refused EVERY command there — which is why no fetch/reset ever advanced
      # the tree and the docker build kept reusing stale code. Mark it safe
      # first, then hard-reset to the fetched branch tip. Touches only tracked
      # files — the untracked, gitignored ./instance (live DB + archives) is left
      # alone (no `git clean`). `set -e` aborts on any git failure so we never
      # silently ship stale code again.
      - |
        cd /opt/projects/${CI_REPO_NAME}
        set -e
        git config --global --add safe.directory /opt/projects/${CI_REPO_NAME}
        git fetch origin ${CI_COMMIT_BRANCH}
        # Fleet deploy standard (2026-08-10): refuse to converge over a hot-
        # patched host tree; untracked files never block.  See mydoulapage 00c6072.
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "DEPLOY REFUSED: tracked files in $(pwd) were edited on the host."
          echo "Commit the change (or git checkout -- <file> to discard) and re-run."
          git status --short
          git diff HEAD
          exit 1
        fi
        git reset --hard FETCH_HEAD
        echo "deploying commit:" && git log -1 --oneline
      - docker network inspect gateway-stack_gateway >/dev/null 2>&1 || docker network create gateway-stack_gateway
      - cd /opt/projects/${CI_REPO_NAME} && docker compose up -d --build
      - docker image prune -f || true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/projects:/opt/projects
    when:
      branch: main
    depends_on:
      - sbom
      - close-package-determinism
      - typecheck
      - build-wheel
